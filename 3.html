<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

<meta name="hosting-provider" content="Netlify">
<meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=1eed3390-8ead-4793-986a-4832b35da1db">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱清洗与密保格式化工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* iOS 风格全局次级背景 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f7;
      min-height: 100vh;
      padding: 24px;
      color: #1c1c1e;
      overflow-x: hidden;
    }

    /* 自定义细滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ================= iOS 纯净毛玻璃全屏开场 ================= */
    .fullscreen-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #1c1c1e;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      cursor: pointer;
      z-index: 9999;
    }

    .fullscreen-blur.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .fullscreen-blur h1 {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .fullscreen-blur p {
      font-size: 18px;
      color: #8e8e93;
      margin-top: 10px;
      font-weight: 500;
    }

    /* ================= 核心悬浮卡片容器 ================= */
    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 960px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(60, 60, 67, 0.08);
      gap: 20px;
      transition: all 0.3s ease;
    }

    /* 左右两列输入排版 */
    .big {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-title {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-left: 2px;
    }

    /* iOS 风格输入框 */
    .box1, .box2 {
      width: 100%;
      height: 280px;
      padding: 16px 18px;
      border-radius: 16px;
      background-color: #f2f2f7;
      border: 1px solid transparent;
      color: #1c1c1e;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .box1::placeholder, .box2::placeholder {
      color: #aeaeb2;
    }

    .box1:focus, .box2:focus {
      background-color: #ffffff;
      border-color: #007aff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
    }

    /* 状态与提示文本 */
    .msg {
      min-height: 20px;
      font-size: 13px;
      font-weight: 500;
      color: #34c759;
      transition: all 0.2s ease;
    }

    /* 提取的邮件单选列表 */
    .data-checkbox {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      background: #f9f9fb;
      border: 1px solid rgba(60, 60, 67, 0.08);
      border-radius: 14px;
      padding: 8px 12px;
      gap: 6px;
    }

    .data-checkbox:empty {
      display: none;
    }

    .glue {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .glue:hover {
      background: rgba(0, 122, 255, 0.08);
    }

    .mylabel {
      font-size: 13px;
      color: #1c1c1e;
      cursor: pointer;
      font-weight: 500;
      user-select: none;
    }

    /* 底部操作与配置区域 */
    .home2 {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .home3 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #f9f9fb;
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(60, 60, 67, 0.06);
      gap: 16px;
    }

    .mihome {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mihome label {
      font-size: 13px;
      font-weight: 600;
      color: #636366;
      white-space: nowrap;
    }

    .mibao {
      flex: 1;
      max-width: 380px;
      height: 38px;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      color: #1c1c1e;
      border: 1px solid rgba(60, 60, 67, 0.12);
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .mibao:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
    }

    /* iOS 胶囊操作按钮 */
    .btnhome {
      display: flex;
      gap: 8px;
    }

    .btn, .btn2 {
      height: 38px;
      padding: 0 18px;
      border-radius: 19px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Click 主按钮（经典高亮蓝） */
    .btn {
      background-color: #007aff;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
    }

    .btn:hover {
      background-color: #0066d6;
    }

    /* Remove & Copy 次级胶囊按钮 */
    .btn2 {
      background: rgba(120, 120, 128, 0.12);
      color: #007aff;
    }

    .btn2:hover {
      background: rgba(0, 122, 255, 0.15);
    }

    .btn:active, .btn2:active {
      transform: scale(0.96);
    }

    /* 选中的结果大字看板 */
    .select {
      min-height: 48px;
      padding: 10px 16px;
      text-align: center;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      color: #007aff;
      background: rgba(0, 122, 255, 0.06);
      border: 1px dashed rgba(0, 122, 255, 0.25);
      word-break: break-all;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .select:empty {
      display: none;
    }

    /* 移动端自适应 */
    @media (max-width: 820px) {
      .home {
        padding: 24px 16px;
      }
      .big {
        flex-direction: column;
      }
      .home3 {
        flex-direction: column;
        align-items: stretch;
      }
      .mihome {
        flex-direction: column;
        align-items: flex-start;
      }
      .mibao {
        max-width: 100%;
        width: 100%;
      }
      .btnhome {
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>
  <!-- 欢迎层 -->
  <div class="fullscreen-blur" id="introOverlay">
    <h1>Welcome.</h1>
    <p>Tap anywhere to start</p>
  </div>

  <!-- 主应用卡片 -->
  <div class="home">
    <div class="big">
      <div class="input-wrapper">
        <span class="input-title">原始文本输入</span>
        <textarea class="box1" placeholder="粘贴带有邮箱地址的文本..."></textarea>
      </div>
      <div class="input-wrapper">
        <span class="input-title">提取与格式化输出</span>
        <textarea class="box2" placeholder="处理后的结果将显示在这里..."></textarea>
      </div>
    </div>

    <label class="msg"></label>

    <div class="data-checkbox"></div>

    <div class="home2">
      <div class="home3">
        <div class="mihome">
          <label for="mibao-input">密保后缀拼接:</label>
          <input type="text" class="mibao" id="mibao-input" value="-X456-	L789-	G321-	1990/1/1">
        </div>

        <div class="btnhome">
          <button class="btn">Click!</button>
          <button class="btn2">Remove</button>
          <button class="btn3 btn2">Copy</button>
        </div>
      </div>

      <div class="select"></div>
    </div>
  </div>

  <script>
    const box1 = document.querySelector(".box1");
    const box2 = document.querySelector('.box2');
    const mibao = document.querySelector(".mibao");

    const btn = document.querySelector(".btn");
    const btn2 = document.querySelector(".btn2");
    const btn3 = document.querySelector('.btn3');

    const container = document.querySelector('.data-checkbox');
    const select = document.querySelector('.select');
    const msg = document.querySelector('.msg');

    // 数据清洗并拼接
    btn.addEventListener('click', function () {
      container.textContent = "";

      let getIneed = box1.value;
      let fixIneed = getIneed.match(/[0-9a-zA-Z._%-]+@[0-9a-zA-Z.-]+\.[a-zA-Z]{2,}\b/g);
      let getmibao = mibao.value;

      if (fixIneed) {
        let over = fixIneed.map(email => email + '\t' + getmibao);
        box2.value = over.join("\n");
        msg.style.color = "#34c759";
        msg.textContent = `成功提取 ${fixIneed.length} 个邮箱！`;
        setTimeout(() => { msg.textContent = ""; }, 2500);
      } else {
        box2.value = "未找到匹配的邮箱地址";
        msg.style.color = "#ff3b30";
        msg.textContent = "未找到匹配数据";
        setTimeout(() => { msg.textContent = ""; }, 2500);
      }

      if (fixIneed) {
        fixIneed.forEach((email, i) => {
          const checkbox = document.createElement("input");
          checkbox.type = 'radio';
          checkbox.classList.add(`email-${email}`);
          checkbox.value = email;
          checkbox.id = `email-${i}`;
          checkbox.name = 'email-group';
          checkbox.style.cursor = 'pointer';

          const label = document.createElement('label');
          label.htmlFor = `email-${i}`;
          label.textContent = email;
          label.classList.add('mylabel');

          const glue = document.createElement('div');
          glue.classList.add('glue');

          glue.appendChild(checkbox);
          glue.appendChild(label);
          container.appendChild(glue);

          checkbox.addEventListener('click', function (event) {
            if (event.target.tagName === 'INPUT') {
              select.textContent = checkbox.value;
            }
          });
        });
      }
    });

    // 清空重置
    btn2.addEventListener('click', function () {
      mibao.value = "";
      box1.value = "";
      box2.value = "";
      container.textContent = "";
      select.textContent = "";
      msg.textContent = "";
    });

    // 复制剪贴板
    btn3.addEventListener('click', async () => {
      if (!box2.value) {
        msg.style.color = "#ff3b30";
        msg.textContent = "暂无可复制的数据！";
        setTimeout(() => { msg.textContent = ""; }, 2000);
      } else {
        try {
          await navigator.clipboard.writeText(box2.value);
          msg.style.color = "#34c759";
          msg.textContent = "✓ 已成功复制到剪贴板！";
          setTimeout(() => { msg.textContent = ""; }, 2000);
        } catch (err) {
          msg.style.color = "#ff3b30";
          msg.textContent = "复制失败，请手动选择复制！";
          setTimeout(() => { msg.textContent = ""; }, 2000);
        }
      }
    });

    // 开场欢迎动画
    window.addEventListener('DOMContentLoaded', () => {
      const me = document.getElementById('introOverlay');
      let tim = setTimeout(() => {
        me.classList.add('show');
      }, 200);

      window.addEventListener('click', () => {
        me.classList.remove('show');
        clearTimeout(tim);
      });
    });

    // 音频播放控制
    const audio = new Audio('./1.mp3');
    audio.loop = true;

    window.addEventListener('click', () => {
      audio.play().catch(() => {});
    }, { once: true });
  </script>
</body>
